 *   1. 엔진은 결과를 "결정"한다. 서술(LLM/텍스트)은 결과를 "설명"한다.
 *   2. 내부 수치는 0~100, 표시 스탯은 1~20 (Copero 스타일).

 *   5. DOM 의존 0 — 브라우저 UI와 헤드리스 배치 러너가 같은 엔진을 공유한다.
 * ========================================================================== */

/* ─────────────────────────── 1. RNG & 수학 유틸 ─────────────────────────── */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeRng(seed) {
  const r = mulberry32(seed);
  const api = {
    seed,
    next: r,
    /** [0,1) */
    f: () => r(),
    /** 정수 [a,b] */
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    /** 확률 p로 true */
    chance: (p) => r() < p,
    /** 정규분포 — 경기력 변동처럼 평균 주변에서 흔들리는 값 */
    norm(mean = 0, sd = 1) {
      let u = 0, v = 0;
      while (u === 0) u = r();
      while (v === 0) v = r();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    /** 우편향 — 성장 폭발/스카우트 발견처럼 소수만 크게 터지는 값. [0,1) */
    rightSkew(power = 2.0) {
      return Math.pow(r(), power);
    },
    /** 헤비테일 — 부상 심각도처럼 대부분 경미하지만 드물게 치명적인 값. [1,∞) */
    heavyTail(alpha = 1.6) {
      return Math.pow(1 - r(), -1 / alpha);
    },
    pick: (arr) => arr[Math.floor(r() * arr.length)],
    /** 가중 추출. items: [{w:number, ...}] */
    weighted(items) {
      let total = 0;
      for (const it of items) total += Math.max(0, it.w);
      if (total <= 0) return null;
      let x = r() * total;
      for (const it of items) {
        x -= Math.max(0, it.w);
        if (x <= 0) return it;
      }
      return items[items.length - 1];
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };
  return api;
}

/* ─────────────────────────── 4. 로그 / 기억 ─────────────────────────── */

function pushLog(g, kind, text) {
  g.log.push({ kind, text, year: g.world.year, phase: g.world.phase, age: ageOf(g) });
  if (g.log.length > 400) g.log.splice(0, g.log.length - 400);
}

function remember(g, tag, text, importance = 0.5, people = []) {
  g.memories.push({ year: g.world.year, age: ageOf(g), tag, text, importance, people, emotion: null });
}
const hasMemory = (g, tag) => g.memories.some((m) => m.tag === tag);
const getMemory = (g, tag) => g.memories.find((m) => m.tag === tag);

/* ─────────────────────────── 5. 시간 / 나이 ─────────────────────────── */

/** 생일 7월 18일 기준. SUMMER(7월)=year-1990, WINTER(1월)=year-1991 */
function ageOf(g) {
  return g.world.phase === 'SUMMER' ? g.world.year - 1990 : g.world.year - 1991;
}

/** 가변형 타임라인: 0~15세 1년, 16~29세 반년, 30~36세 1년 */
function cadenceOf(age) {
  return age >= 16 && age <= 29 ? 'HALF' : 'YEAR';
}

function periodLabel(g) {
  const age = ageOf(g);
  if (g.world.phase === 'WINTER') {
    return `${g.world.year}년 1월 — 겨울 이적시장 (만 ${age}세)`;
  }
  if (age <= 15) return `${g.world.year}년 (만 ${age}세)`;
  return `${g.world.year}/${String((g.world.year + 1) % 100).padStart(2, '0')} 시즌 개막 (만 ${age}세)`;
}

function advanceClock(g) {
  const age = ageOf(g);
  const cad = cadenceOf(age);
  if (cad === 'HALF') {
    if (g.world.phase === 'SUMMER') {
      g.world.phase = 'WINTER';
      g.world.year += 1;
    } else {
      g.world.phase = 'SUMMER';
    }
  } else {
    g.world.phase = 'SUMMER';
    g.world.year += 1;
  }
}

/** 이번 턴이 커버하는 기간(년) */
function periodYears(g) {
  return cadenceOf(ageOf(g)) === 'HALF' ? 0.5 : 1;
}

/* ─────────────────────────── 6. 성장 모델 ─────────────────────────── */

/**
 * 나이별 성장 계수. 선형이 아니고, 12~19세에 몰려 있고 24세 이후 급감한다.
 * lateBloomer면 커브 전체가 오른쪽으로 밀린다.
 */
function growthCurve(age, lateBloomer) {
  const a = lateBloomer ? age - 3 : age;
  if (a < 5) return 0;
  if (a < 8) return 0.9;
  if (a < 12) return 1.9;
  if (a < 16) return 2.6;
  if (a < 20) return 2.3;
  if (a < 24) return 1.25;
  if (a < 27) return 0.5;
  if (a < 30) return 0.16;
  return 0;
}

function trainingQuality(g) {
  const p = g.player;
  if (p.club) {
    const c = p.club;
    let q = c.train;
    // 출전 못 하면 훈련 수준이 아무리 높아도 성장이 깎인다
    const last = p.career.seasons[p.career.seasons.length - 1];
    if (last && last.apps < 6 && ageOf(g) >= 17) q -= 12;
    return clamp(q, 20, 100);
  }
  // 무소속: 동네 축구 + 인프라
  return clamp(28 + ORIGINS[g.originId].env.infra * 0.35 + (g.flags.privateCoach ? 12 : 0), 15, 80);
}

/**
 * 환경 천장 (Environmental Ceiling) — 이 엔진의 핵심 명제.
 *
 * 잠재력(PA)은 "도달 가능한 수치"가 아니라 "환경이 허락하는 만큼만 열리는 수치"다.
 * 12~22세에 겪은 훈련 환경의 누적 평균(devEnv)이 PA의 몇 %를 개방할지 결정한다.
 * → PA 94를 갖고 태어나도 AYSO 리크리에이션 리그에서만 자랐다면 60대에서 끝난다.
 */
function developmentCeiling(p) {
  const env = p.devEnv ?? 55;
  const opened = 0.52 + 0.48 * clamp((env - 30) / 55, 0, 1);
  return p.hidden.potential * clamp(opened, 0.52, 1);
}

function applyGrowth(g) {
  const p = g.player;
  const age = ageOf(g);
  const years = periodYears(g);
  const curve = growthCurve(age, p.hidden.lateBloomer);

  // 발달기 환경을 누적 기록한다 (지수이동평균)
  if (age >= 11 && age <= 22) {
    const tq = trainingQuality(g);
    p.devEnv = p.devEnv == null ? tq : p.devEnv * 0.78 + tq * 0.22;
  }

  if (age >= 30 || (curve === 0 && age >= 26)) {
    // 에이징 커브 — 30세 이후 하락, 전술/판단은 소폭 상승
    if (age >= 30) {
      const decline = years * (0.6 + Math.max(0, age - 30) * 0.42) * (1 + (60 - p.hidden.pro) / 160);
      p.ovr = clamp(p.ovr - decline, 20, 99);
      p.profile.pace -= years * 1.4;
      p.profile.physical -= years * 1.0;
      p.profile.tactical += years * 0.8;
      p.profile.decision += years * 0.7;
    }
    return;
  }
  if (!p.active) return;

  const ceiling = developmentCeiling(p);
  const gap = ceiling - p.ovr;
  if (gap <= 0.3) {
    // 천장에 닿았다. 환경이 좋아지면 천장 자체가 다시 올라간다.
    p.peakOvr = Math.max(p.peakOvr || 0, p.ovr);
    return;
  }

  const tq = trainingQuality(g);
  const absorb = p.hidden.absorption;
  const mult = 0.45 + tq / 150 + absorb / 220 + (p.trait.discipline - 50) / 400;
  const noise = 0.55 + g.rng.rightSkew(1.35) * 1.5; // 폭발 성장은 소수에게만
  const stressPenalty = 1 - clamp(p.stress - 45, 0, 55) / 130;
  const injuryPenalty = p.injuryWeeks > 8 ? 0.55 : p.injuryWeeks > 0 ? 0.82 : 1;

  let delta = years * curve * (gap / 100) * mult * noise * 5.6 * stressPenalty * injuryPenalty;
  delta = clamp(delta, 0, 13);
  p.ovr = clamp(p.ovr + delta, 0, 99);
  p.peakOvr = Math.max(p.peakOvr || 0, p.ovr);

  // 성장 폭발/정체를 서술로 노출 (수치는 숨긴 채). 같은 문장이 반복되면 기계처럼 읽힌다.
  const GREW = [
    '이 기간, 눈에 보이게 달라졌다. 지난 시즌 자신을 막던 수비수를 이제는 아무렇지 않게 지나간다.',
    '몸이 기술을 따라잡았다. 머리로 그리던 장면이 실제로 나오기 시작했다.',
    '코치가 훈련 중에 멈추고 다시 해보라고 했다. 좋은 뜻으로 멈춘 것이다.',
    '한 단계 올라갔다는 걸 스스로도 안다. 같은 상황에서 선택지가 두 개 더 보인다.',
  ];
  const STALL = [
    '몸이 늘지 않는다. 훈련량은 그대로인데 경기에서는 계속 반 박자 늦는다.',
    '제자리다. 주변이 빠르게 느는 만큼, 제자리는 곧 뒤처지는 것이다.',
    '작년 영상과 올해 영상을 비교해봤다. 차이를 찾지 못했다.',
  ];
  if (age >= 12 && delta > 3.6) pushLog(g, 'growth', g.rng.pick(GREW));
  else if (age >= 14 && delta < 0.7) pushLog(g, 'growth', g.rng.pick(STALL));
}

/** 표시용 능력치 (1~20) */
function visibleStats(g) {
  const p = g.player;
  const age = ageOf(g);
  const pos = POSITIONS[p.position];
  // ovr 자체가 이미 나이에 따른 발달 수준을 담고 있다. 여기서 다시 나이를 깎으면
  // 8세 선수의 모든 스탯이 1로 찍혀서 표시가 고장난 것처럼 보인다.
  // 미성숙한 신체/전술 이해만 소폭 보정한다.
  const imm = age < 18 ? (18 - age) : 0;
  const raw = {
    pace: p.ovr + p.profile.pace,
    dribble: p.ovr + p.profile.dribble,
    pass: p.ovr + p.profile.pass,
    shoot: p.ovr + p.profile.shoot,
    physical: p.ovr + p.profile.physical - imm * 1.1,
    tactical: p.ovr + p.profile.tactical - imm * 0.9,
    decision: p.ovr + p.profile.decision - imm * 0.7,
  };
  raw.dribble *= pos.tech > 1 ? 1.03 : 0.98;
  raw.physical *= pos.phys > 1 ? 1.04 : 0.97;
  const out = {};
  for (const k in raw) out[k] = to20(clamp(raw[k], 3, 99));
  return out;
}

const STAT_LABELS = {
  pace: '주력', dribble: '드리블', pass: '패스', shoot: '슈팅',
  physical: '피지컬', tactical: '전술 이해', decision: '판단력',
};

/* ─────────────────────────── 7. 시즌 시뮬레이션 ─────────────────────────── */

function matchesInPeriod(g) {
  const years = periodYears(g);
  const age = ageOf(g);
  if (age < 10) return 0;
  const base = age < 16 ? 24 : g.player.club && g.player.club.tier <= 2 ? 42 : 36;
  return Math.round(base * years);
}

function simulatePeriod(g) {
  const p = g.player;
  const age = ageOf(g);
  if (!p.active || age < 10) return null;

  // 부상 회복
  if (p.injuryWeeks > 0) {
    const weeksInPeriod = periodYears(g) * 52;
    p.injuryWeeks = Math.max(0, p.injuryWeeks - weeksInPeriod);
  }

  const club = p.club;
  if (!club) return null;

  // 유소년 경기는 성인 리그 기준이 아니라 "같은 나이 또래" 기준으로 뽑힌다.
  // 성인 요구치를 그대로 쓰면 14세 아카데미 선수가 시즌 1경기만 뛰게 된다.
  const req = age < 17
    ? 14 + (age - 10) * 3.8 + (6 - club.tier) * 2
    : TIER_REQ[club.tier];
  const trust = g.npcs.coach.trust;
  const edge = p.ovr - req + (trust - 50) / 5 + (p.form - 55) / 8 + g.rng.norm(0, 2.5);
  const share = clamp(sigmoid(edge / 6.5), 0.02, 0.97);

  const total = matchesInPeriod(g);
  const availability = clamp(1 - p.injuryWeeks / (periodYears(g) * 52), 0, 1);
  const apps = Math.round(total * share * availability);

  const pos = POSITIONS[p.position];
  const perfLevel = clamp(p.ovr - req, -25, 25);
  const bigMatchBonus = club.tier <= 2 ? (p.hidden.bigMatch - 50) / 12 : 0;
  const rating = clamp(
    6.35 + perfLevel * 0.055 + bigMatchBonus * 0.12 +
      g.rng.norm(0, 0.42) * (1 + (60 - p.hidden.consistency) / 140),
    4.9, 9.4
  );

  const scoreRate = pos.goal * (0.55 + clamp(p.ovr - req + 14, 0, 40) / 40) * (rating / 6.9);
  const assistRate = pos.assist * (0.6 + clamp(p.ovr - req + 14, 0, 40) / 44) * (rating / 6.9);
  const goals = Math.max(0, Math.round(apps * scoreRate * (0.65 + g.rng.f() * 0.75)));
  const assists = Math.max(0, Math.round(apps * assistRate * (0.65 + g.rng.f() * 0.75)));

  // 유소년 경기는 커리어 통산 기록에 들어가지 않는다
  if (age >= 16) {
    p.career.apps += apps;
    p.career.goals += goals;
    p.career.assists += assists;
  } else {
    p.career.youthApps = (p.career.youthApps || 0) + apps;
  }
  p.form = clamp(45 + (rating - 6.4) * 22 + g.rng.norm(0, 5), 10, 98);

  // 신뢰/자신감/평판
  g.npcs.coach.trust = clamp(trust + (rating - 6.6) * 9 + (apps > total * 0.5 ? 3 : -2), 5, 98);
  p.confidence = clamp(p.confidence + (rating - 6.55) * 14 + (apps < 3 ? -6 : 2), 5, 98);
  p.stress = clamp(p.stress + (apps < 3 ? 5 : -3) + (club.comp - 70) / 12, 0, 100);
  // 평판은 누적되지 않는다. 소속 클럽 수준이 만드는 기준선으로 계속 끌려간다.
  // 유소년 활약은 평판이 되지 않는다 — 라 마시아에서 잘하는 15세는 아직 무명이다.
  const REP_BASE = { 1: 68, 2: 52, 3: 36, 4: 21, 5: 10, 6: 4 };
  const youthCap = age < 17 ? 0.22 : 1;
  const baseline = (REP_BASE[club.tier] ?? 10) * clamp(0.4 + share, 0.4, 1.3) * youthCap;
  p.reputation += (baseline - p.reputation) * 0.28 * (periodYears(g) * 2);
  const repGain = (rating - 6.4) * 4.0 * (club.expo / 70) * (apps / Math.max(1, total * 0.4)) * youthCap;
  p.reputation = clamp(p.reputation + clamp(repGain, -6, 12), 0, 100);
  if (age >= 17) p.peakReputation = Math.max(p.peakReputation || 0, p.reputation);

  // 부상 판정 — 조건부 확률. "운"이 아니라 "혹사의 결과"로 느껴지게
  const load = apps / Math.max(1, total);
  const ageRisk = age < 18 ? 1.15 : age > 30 ? 1 + (age - 30) * 0.11 : 1;
  const pInj =
    0.075 * periodYears(g) * 2 *
    (0.5 + load) *
    (p.hidden.injuryProne / 55) *
    ageRisk *
    (1 + clamp(p.stress - 50, 0, 50) / 120) *
    (g.flags.overtrain ? 1.35 : 1);
  let injuryNote = null;
  if (g.rng.chance(clamp(pInj, 0, 0.75))) {
    const weeks = Math.min(64, Math.ceil(g.rng.heavyTail(1.55) * 1.7));
    p.injuryWeeks += weeks;
    injuryNote = weeks;
    p.confidence = clamp(p.confidence - weeks * 0.6, 5, 98);
    if (weeks >= 24) {
      p.hidden.potential = clamp(p.hidden.potential - g.rng.int(2, 7), 40, 99);
      p.hidden.injuryProne = clamp(p.hidden.injuryProne + g.rng.int(4, 12), 8, 98);
      p.willToPlay -= g.rng.int(8, 22);
      remember(g, 'major_injury', `${g.world.year}년, ${weeks}주 부상. 커리어의 방향이 바뀌었다.`, 0.9);
      // 부상으로 인한 강제 은퇴 — 재활을 버티지 못하는 커리어가 실제로 존재한다
      const bail = clamp(0.20 + (weeks - 24) / 70 + (55 - p.willToPlay) / 180 + (age > 29 ? 0.2 : 0), 0, 0.75);
      if (g.rng.chance(bail)) {
        p.active = false;
        g.flags.injuryEnded = true;
        p.path.push(`${g.world.year} 부상으로 커리어 종료`);
        remember(g, 'injury_retire', `${g.world.year}년, ${weeks}주 부상 끝에 선수 생활을 접었다.`, 1.0);
        pushLog(g, 'injury', '재활이 끝나지 않았다. 의사도, 구단도, 더는 다음을 말하지 않았다.');
      }
    }
  }

  // 축구를 계속할 의지 — 출전 시간과 수준에 따라 실제로 닳는다
  if (age >= 14) {
    let dw = 0;
    if (apps < Math.max(2, total * 0.15)) dw -= 7 * periodYears(g) * 2;
    else if (share > 0.6) dw += 4 * periodYears(g) * 2;
    if (club.tier >= 6) dw -= 5 * periodYears(g) * 2;
    if (p.econ.wageYear === 0 && age >= 18) dw -= 6 * periodYears(g) * 2;
    dw += (p.hidden.grit - 50) / 14;
    p.willToPlay = clamp(p.willToPlay + dw, 0, 100);
  }

  // 경제
  if (age >= 16 && club.tier <= 5) {
    const wage = Math.round(club.wage * 1_400_000 * (0.25 + clamp(p.ovr - 55, 0, 40) / 45) * (0.7 + p.reputation / 140));
    p.econ.wageYear = wage;
    p.econ.assets += Math.round(wage * periodYears(g) * 0.55);
    const fol = Math.round(p.reputation ** 1.9 * (club.expo / 60) * 22 * (1 + (g.flags.viralPR ? 1.4 : 0)));
    p.econ.followers = Math.max(p.econ.followers, fol);
    p.econ.endorsements = Math.round(p.econ.followers * 0.9 + (p.reputation > 60 ? p.reputation * 6200 : 0));
    p.econ.assets += Math.round(p.econ.endorsements * periodYears(g) * 0.5);
    p.econ.familyInfluence = clamp(12 + p.reputation * 0.55 + Math.min(35, p.econ.assets / 60000), 10, 98);
  }

  const season = {
    year: g.world.year, phase: g.world.phase, age, club: club.name,
    apps, goals, assists, rating: +rating.toFixed(2), injuryWeeks: injuryNote || 0,
  };
  p.career.seasons.push(season);

  // 서술
  let line = `${club.name} — ${apps}경기 ${goals}골 ${assists}도움, 평점 ${rating.toFixed(2)}`;
  if (apps === 0) line += ' · 출전 기회를 전혀 얻지 못했다.';
  else if (share < 0.2) line += ' · 대부분 벤치에서 지켜봤다.';
  else if (share > 0.8) line += ' · 확실한 주전이었다.';
  pushLog(g, 'season', line);
  if (injuryNote) {
    pushLog(g, 'injury', injuryNote >= 24
      ? `${injuryNote}주 아웃. 큰 부상이다. 재활실 천장을 오래 보게 됐다.`
      : `${injuryNote}주 부상으로 이탈했다.`);
  }
  return season;
}

/* ─────────────────────────── 8. 라이벌 / 사촌 / 세계 ─────────────────────────── */

function simulateWorld(g) {
  const years = periodYears(g);
  const age = ageOf(g);
  const r = g.npcs.rival;
  if (r.alive) {
    const gap = r.potential - r.ovr;
    const curve = growthCurve(age, false);
    r.ovr = clamp(r.ovr + years * curve * (gap / 100) * (0.8 + g.rng.f() * 0.9) * 3.4, 0, 99);
    if (age >= 18 && !r.club) {
      const t = r.ovr > 74 ? 2 : r.ovr > 66 ? 3 : r.ovr > 58 ? 4 : 5;
      r.club = g.rng.pick(CLUBS.filter((c) => c.tier === t)).name;
    }
    if (age >= 20 && r.ovr > 76 && g.rng.chance(0.35 * years)) r.caps += g.rng.int(1, 6);
    if (age >= 24 && g.rng.chance(0.06 * years)) { // 라이벌도 무너질 수 있다
      r.potential = clamp(r.potential - g.rng.int(4, 12), 40, 96);
    }
  }
  // 사촌 라이벌 — 주인공의 성공에 자극받아 성장
  const c = g.npcs.cousin;
  if (age >= 12) {
    const provoked = clamp((g.player.reputation - c.fame) / 20, -1, 3);
    c.fame = clamp(c.fame + years * (1.2 + provoked * 1.8 + g.rng.f()), 0, 100);
    c.stage = c.fame > 70 ? 3 : c.fame > 45 ? 2 : c.fame > 22 ? 1 : 0;
  }
}

const COUSIN_STAGE = [
  '조용함',
  '[관망 단계] "얘 좀 하네?" 정도로 보고 있다',
  '[도발 단계] 명절마다 기록을 비교당한다',
  '[전면 경쟁] 언론이 둘을 나란히 놓고 쓴다',
];

/* ─────────────────────────── 9. 국가대표 ─────────────────────────── */

function nationalTeamCheck(g) {
  const p = g.player;
  const age = ageOf(g);
  if (!p.active || age < 18) return;
  const nt = p.ntTeam || p.nationality;
  const bar = NT_STRENGTH[nt] ?? 70;
  if (!p.ntTeam) {
    if (p.ovr + p.reputation * 0.25 > bar - 4 && g.rng.chance(0.55)) {
      p.ntTeam = nt;
      p.career.caps += 1;
      pushLog(g, 'nt', `${nt} 대표팀 A매치 데뷔. 이름 옆에 국기가 붙었다.`);
      remember(g, 'nt_debut', `${g.world.year}년 ${nt} 대표팀 데뷔`, 0.75);
      p.confidence = clamp(p.confidence + 8, 5, 98);
      p.reputation = clamp(p.reputation + 6, 0, 100);
    }
    return;
  }
  if (p.ovr + p.reputation * 0.22 > bar - 6) {
    const caps = Math.round(periodYears(g) * g.rng.int(3, 9));
    p.career.caps += caps;
    p.career.ntGoals += Math.round(caps * POSITIONS[p.position].goal * 0.6 * g.rng.f() * 1.6);
  }
}

/* ─────────────────────────── 10. 이적 / 오퍼 ─────────────────────────── */

/**
 * 스카우트 평가에는 오차가 있다. 같은 선수라도 클럽마다 다르게 본다.
 * 최종 평가 = 실제 능력 0.75 + 스카우트 오차 0.15 + 당일 컨디션 0.10
 */
function scoutedValue(g, club) {
  const p = g.player;
  const err = g.rng.norm(0, 6.5) * (1 - (club.expo / 100) * 0.45);
  const cond = (p.form - 55) / 4 + g.rng.norm(0, 3);
  return p.ovr * 0.75 + (p.ovr + err) * 0.15 + (p.ovr + cond) * 0.10 + p.reputation * 0.12;
}

function generateOffers(g, count = 3) {
  const p = g.player;
  const age = ageOf(g);
  const pool = CLUBS.filter((c) => {
    if (p.club && c.id === p.club.id) return false;
    const v = scoutedValue(g, c);
    // 클럽은 자기 티어 요구치보다 약간 낮아도 잠재력을 보고 데려간다
    const need = TIER_REQ[c.tier] - (age <= 21 ? 7 : 1);
    if (v < need) return false;
    if (v > TIER_REQ[c.tier] + 16 && c.tier >= 4) return false; // 오버스펙이면 하위 클럽은 못 데려옴
    // 국제이적: 노출/평판이 낮으면 해외 클럽은 안 본다
    if (c.c !== p.nationality && p.reputation < 28 && age < 22) return false;
    if (age < 18 && c.c !== p.nationality && g.world.year >= 2001) return false; // FIFA 18세 미만 국제이적 제한
    return true;
  });
  if (!pool.length) return [];
  const scored = pool.map((c) => ({
    w: 1 / (1 + Math.abs(scoutedValue(g, c) - TIER_REQ[c.tier]) / 6) * (c.tier <= 2 ? 0.7 : 1),
    c,
  }));
  const out = [];
  for (let i = 0; i < count && scored.length; i++) {
    const pickd = g.rng.weighted(scored);
    if (!pickd) break;
    out.push(pickd.c);
    scored.splice(scored.indexOf(pickd), 1);
  }
  return out;
}

function joinClub(g, club, opts = {}) {
  const p = g.player;
  p.club = { ...club };
  p.parentClub = opts.loanFrom || null;
  p.contractUntil = g.world.year + (opts.years ?? (ageOf(g) < 20 ? 3 : 4));
  g.npcs.coach = { name: null, trust: clamp(48 + g.rng.norm(0, 9) + (opts.wanted ? 10 : 0), 10, 90) };
  p.hidden.adaptability = clamp(p.hidden.adaptability, 5, 98);
  // 적응 리스크
  const adaptShock = clamp((club.comp - 65) / 6 - (p.hidden.adaptability - 50) / 8, -6, 14);
  p.stress = clamp(p.stress + adaptShock, 0, 100);
  p.path.push(`${g.world.year} ${club.name}${opts.loanFrom ? ' (임대)' : ''}`);
  pushLog(g, 'transfer', `${club.name} 합류. ${club.league} · ${TIER_LABEL[club.tier]}${opts.loanFrom ? ` (${opts.loanFrom.name}에서 임대)` : ''}`);
}

ev({
  id: 'trial_result', once: true, when: (g) => g.flags.pendingTrialResult, w: () => 999,
  body: (g) => {
    const p = g.player;
    // 평가 매트릭스: 기술25 전술20 1대1 15 신체10 판단15 태도10 성장5
    // 중요: 절대 수치가 아니라 "같은 나이 지원자 평균 대비"로 채점한다.
    // 12세를 성인 스케일로 재면 아무도 통과하지 못한다.
    const PEER = 34; // 엘리트 트라이아웃에 오는 12세 지원자의 평균 기량
    const dev = (v) => clamp(50 + (v - PEER) * 2.4, 0, 100);
    const tech = dev(p.ovr + p.profile.dribble), tac = dev(p.ovr + p.profile.tactical),
      one = dev(p.ovr + p.profile.dribble + 3), phys = dev(p.ovr + p.profile.physical),
      dec = dev(p.ovr + p.profile.decision),
      att = clamp(45 + p.trait.discipline * 0.4 + p.hidden.grit * 0.2, 0, 100),
      grow = clamp(p.hidden.potential + 6, 0, 100); // 스카우트가 보는 "성장 가능성"
    let base = tech * 0.25 + tac * 0.2 + one * 0.15 + phys * 0.10 + dec * 0.15 + att * 0.10 + grow * 0.05;
    if (g.flags.trialStyle === 'flash') base += g.rng.chance(0.5) ? 9 : -9;
    if (g.flags.trialStyle === 'safe') base += 3 - Math.max(0, (grow - 80) * 0.2);
    // 최종 평가 = 실제 능력 75% + 스카우트 평가오차 15% + 당일 컨디션 10%
    const finalScore = base * 0.75 + (base + g.rng.norm(0, 9)) * 0.15 + (base + g.rng.norm(0, 7)) * 0.10;
    g.flags.trialScore = finalScore;
    const cut = isESP(g) ? 71 : 63; // 라 마시아가 ODP보다 좁다
    g.flags.trialPass = finalScore >= cut;
    const detail = isESP(g)
      ? `[평가 리포트 — 요약]\n기술 ${to20(tech)}/20 · 전술 이해 ${to20(tac)}/20 · 1대1 ${to20(one)}/20\n신체조건 ${to20(phys)}/20 · 의사결정 ${to20(dec)}/20 · 태도 ${to20(att)}/20`
      : `[ODP 평가 — 요약]\n운동능력 ${to20(phys)}/20 · 볼 스킬 ${to20(tech)}/20 · 판단 ${to20(dec)}/20`;
    return g.flags.trialPass
      ? `${detail}\n\n결과: 합격.`
      : `${detail}\n\n결과: 불합격.\n\n리포트 마지막 줄에는 이렇게 적혀 있다.\n"나쁜 선수가 아니다. 다만 현재 신체조건과 포지션 경쟁을 고려하면, 지금 우리 시스템에 넣어야 할 필연성이 낮다."`;
  },
  choices: (g) => {
    g.flags.pendingTrialResult = false;
    if (g.flags.trialPass) {
      return [{
        t: '들어간다.', tags: [],
        fx: (gg) => {
          gg.world.academyAccess = 2;
          const c = isESP(gg) ? clubById('barca') : clubById('galaxy');
          joinClub(gg, c, { wanted: true, years: 5 });
          gg.player.stress += 14; gg.player.confidence += 12;
          remember(gg, 'academy_in', `${gg.world.year}년, ${c.name} 유소년 합격.`, 0.85);
        },
        out: (gg) => isESP(gg)
          ? '숙소에 짐을 풀었다. 같은 방 아이 셋 다 자기 지역에서 제일 잘하는 애였다.'
          : '아카데미 유니폼을 받았다. 아버지는 사진을 찍어 형에게 보냈다.',
      }];
    }
    return [
      { t: '증명해 보이겠다는 쪽으로 마음을 굳힌다.', tags: ['ambition', 'pride'],
        fx: (gg) => { gg.player.trait.ambition += 8; gg.player.trait.pride += 8; gg.player.hidden.grit += 6; gg.player.stress += 8; gg.player.confidence -= 4; },
        out: (gg) => { remember(gg, 'rejection', `${gg.world.year}년 ${isESP(gg) ? '바르셀로나 유소년' : 'ODP'} 탈락. 이날의 리포트 문장을 외웠다.`, 0.95, ['scout']); return '"필연성이 낮다"는 문장을 종이에 적어 서랍에 넣었다.'; } },
      { t: '자신감을 잃는다. 한동안 공을 보지 않았다.', tags: [],
        fx: (gg) => { gg.player.confidence -= 16; gg.player.stress += 12; gg.player.willToPlay -= 10; },

ev({

      : par.id === 'ATHLETE'

  },

      t: 'MLS Generation adidas 계약 — 대학을 포기하고 프로 직행.', tags: ['risk', 'ambition'],

});

ev({
  id: 'summer_window', when: (g) => g.world.phase === 'SUMMER' && A(g) >= 18 && A(g) <= 30 && g.player.active && g.player.club, w: () => 130,
  body: (g) => {
    const offers = generateOffers(g, 3);
    g.flags._offers = offers.map((c) => c.id);
    if (!offers.length) return `여름 이적시장. 전화는 조용하다.\n현재: ${g.player.club.name} · 감독 신뢰 ${Math.round(g.npcs.coach.trust)}/100`;
    return `여름 이적시장이 열렸다.\n\n${offers.map((c) => `· ${c.name} (${c.league}, ${TIER_LABEL[c.tier]}) — 훈련 ${'★'.repeat(Math.round(c.train / 20))} / 경쟁 ${'★'.repeat(Math.round(c.comp / 20))} / 노출 ${'★'.repeat(Math.round(c.expo / 20))} / 예상 주급 계수 ×${c.wage.toFixed(2)}`).join('\n')}\n\n현재: ${g.player.club.name} · 감독 신뢰 ${Math.round(g.npcs.coach.trust)}/100`;
  },
  choices: (g) => {
    const list = (g.flags._offers || []).map((id) => {
      const c = clubById(id);
      const step = c.tier < g.player.club.tier;
      return {
        t: `${c.name}으로 이적한다. ${step ? '(상위 도전)' : '(주전 보장 쪽)'}`,
        tags: step ? ['ambition', 'risk'] : ['safe'],
        fx: (gg) => { joinClub(gg, c, { years: 4, wanted: !step }); gg.player.reputation += step ? 5 : 1; },
        out: (gg) => step
          ? `${c.name}. 여기서는 아무것도 보장되지 않는다. 그게 온 이유다.`
          : `${c.name}. 매주 90분을 뛸 수 있다면 티어는 숫자일 뿐이다.`,
      };
    });
    list.push({
      t: '남는다. 이 팀에서 증명한다.', tags: ['pride', 'discipline'],
      fx: (gg) => { gg.npcs.coach.trust += 6; gg.player.stress -= 4; gg.player.trait.pride += 4; },
      out: () => '떠나는 게 쉬웠을 것이다. 남는 쪽을 골랐다.' });
    if (g.player.reputation > 40 && g.player.econ.followers > 20000) list.push({
      t: '바이럴 PR — 숏폼으로 이미지를 관리한다.', tags: ['risk'],
      fx: (gg) => {
        gg.flags.viralPR = true;
        gg.player.econ.followers = Math.round(gg.player.econ.followers * 2.1);
        gg.player.reputation += 4; gg.player.stress += 8;
        gg.player.econ.endorsements = Math.round(gg.player.econ.endorsements * 1.6);
        if (gg.rng.chance(0.25)) { gg.npcs.coach.trust -= 12; gg.flags.mediaBacklash = true; }
      },
      out: (gg) => gg.flags.mediaBacklash
        ? '팔로워는 폭증했다. 감독이 라커룸에서 한마디 했다. "그 영상 찍을 시간에 스프린트나 해."'
        : '냉혹한 이미지를 "옆집 형" 톤으로 세탁했다. 스폰서 문의가 두 배가 됐다.' });
    return list;
  },
});

ev({
  id: 'winter_window', when: (g) => g.world.phase === 'WINTER' && A(g) >= 17 && A(g) <= 30 && g.player.active && g.player.club, w: () => 150,
  body: (g) => {
    const last = g.player.career.seasons[g.player.career.seasons.length - 1];
    const benched = last && last.apps < 6;
    return benched
      ? `겨울 이적시장. 전반기 출전 ${last ? last.apps : 0}경기.\n이 상태로 후반기를 보내면 시즌 하나가 통째로 사라진다.\n\n에이전트: "지금 임대로 나가야 해. 6개월이면 충분해."`
      : `겨울 이적시장. 전반기는 나쁘지 않았다 (${last ? `${last.apps}경기 ${last.goals}골` : '-'}).\n체력이 떨어지는 시기다. 감독은 로테이션을 고민하고 있다.`;
  },
  choices: (g) => {
    const last = g.player.career.seasons[g.player.career.seasons.length - 1];
    const benched = last && last.apps < 6;
    const list = [];
    if (benched) {
      const loanTargets = CLUBS.filter((c) => c.tier === clamp(g.player.club.tier + 1, 1, 6) && c.id !== g.player.club.id);
      const target = loanTargets.length ? g.rng.pick(loanTargets) : null;
      if (target) list.push({
        t: `${target.name}으로 6개월 단기 임대를 간다.`, tags: ['risk', 'adaptability'],
        fx: (gg) => {
          const from = gg.player.club;
          joinClub(gg, target, { years: 1, loanFrom: from, wanted: true });
          gg.npcs.coach.trust = clamp(gg.npcs.coach.trust + 18, 10, 95);
          gg.player.hidden.adaptability += 4;
          remember(gg, 'winter_loan', `${gg.world.year}년 겨울, ${target.name} 단기 임대. 여기서 반전이 시작됐다.`, 0.8);
        },
        out: () => '반년짜리 도박이다. 여기서 못 하면 돌아갈 자리도 없다.' });
    }
    list.push({
      t: '남아서 후반기 경쟁을 정면으로 한다.', tags: ['pride'],
      fx: (gg) => { gg.player.stress += 10; gg.npcs.coach.trust += 4; gg.player.trait.pride += 5; },
      out: () => '훈련장에서 가장 먼저 나오고 가장 늦게 들어갔다.' });
    list.push({
      t: '체력을 아끼고 후반기 몸 상태에 투자한다.', tags: ['discipline'],
      fx: (gg) => { gg.player.fitness = clamp(gg.player.fitness + 12, 0, 100); gg.player.hidden.injuryProne -= 5; gg.player.form -= 4; gg.flags.overtrain = false; },
      out: () => '2월에 몸이 가벼웠다. 3월에 그게 결과로 나왔다.' });
    return list;
  },
});

ev({
  id: 'manager_change', when: (g) => A(g) >= 18 && g.player.active && g.player.club, w: () => 65,
  body: (g) => `${g.player.club.name} 감독이 경질됐다. 새 감독이 온다. 그동안 쌓아온 신뢰 ${Math.round(g.npcs.coach.trust)}는 리셋이다.`,

    { t: '새 감독의 전술에 맞춰 스타일을 바꾼다.', tags: ['adaptability'],
      fx: (gg) => { gg.npcs.coach.trust = clamp(50 + (gg.player.hidden.adaptability - 50) / 2 + gg.rng.norm(0, 8), 10, 95); gg.player.profile.tactical += 3; gg.player.trait.adaptability += 8; },
      out: (gg) => gg.npcs.coach.trust > 60 ? '새 감독의 첫 명단에 이름이 있었다.' : '맞추려 했지만, 그가 원하는 선수는 내가 아니었다.' },
    { t: '내 강점을 그대로 밀고 간다.', tags: ['pride', 'risk'],

      out: (gg) => gg.npcs.coach.trust > 55 ? '감독이 결국 나에게 맞춰 팀을 짰다.' : '벤치에서 후반기를 보냈다. 자존심의 대가.' },

ev({

      fx: (gg) => { gg.player.trait.pride += 10; gg.player.hidden.grit += 6; gg.flags.waitedForNT = true; },

});

ev({
  id: 'world_cup_squad', when: (g) => WORLD_CUP_YEARS.includes(g.world.year) && g.world.phase === 'SUMMER' && A(g) >= 20 && A(g) <= 34 && g.player.active && g.player.ntTeam, w: () => 400,
  body: (g) => {
    const bar = NT_STRENGTH[g.player.ntTeam] ?? 70;
    const inSquad = g.player.ovr + g.player.reputation * 0.3 + g.rng.norm(0, 5) > bar + 2;
    g.flags._wcIn = inSquad;
    return inSquad
      ? `${g.world.year} 월드컵 최종 명단이 발표됐다. 이름이 있다.`
      : `${g.world.year} 월드컵 최종 명단이 발표됐다. 이름이 없다.\n\n예비 명단 마지막 줄에 있었다는 건 나중에 알았다.`;
  },
  choices: (g) => {
    if (!g.flags._wcIn) return [{
      t: 'TV로 본다.', tags: [],
      fx: (gg) => { gg.player.confidence -= 10; gg.player.hidden.grit += 8; gg.player.stress += 8; remember(gg, 'wc_missed', `${gg.world.year}년 월드컵 명단 탈락.`, 0.8); },
      out: () => '4년 뒤에는 서른이 넘는다. 그 계산을 하고 있는 자신이 싫었다.' }];
    return [{
      t: '대회에 나간다.', tags: [],
      fx: (gg) => {
        gg.player.ntLocked = true;
        const perf = gg.player.hidden.bigMatch + gg.rng.norm(0, 14);
        gg.player.career.caps += gg.rng.int(2, 6);
        if (perf > 70) {
          gg.player.reputation = clamp(gg.player.reputation + 18, 0, 100);
          gg.player.career.trophies.push(`${gg.world.year} 월드컵 활약`);
          gg.player.econ.followers = Math.round(gg.player.econ.followers * 2.4 + 40000);
          gg.flags.wcHero = true;
          remember(gg, 'wc_hero', `${gg.world.year}년 월드컵에서 인생 경기를 했다.`, 1.0);
        } else if (perf < 40) {
          gg.player.reputation = clamp(gg.player.reputation - 8, 0, 100);
          gg.player.confidence -= 14;
          remember(gg, 'wc_flop', `${gg.world.year}년 월드컵. 큰 무대에서 얼어붙었다.`, 0.9);
        } else {
          gg.player.reputation = clamp(gg.player.reputation + 7, 0, 100);
          remember(gg, 'wc_played', `${gg.world.year}년 월드컵 출전.`, 0.75);
        }
      },
      out: (gg) => gg.flags.wcHero
        ? '90분 동안, 전 세계가 이 이름을 배웠다.'

        ? '빅매치 멘탈이라는 게 정말 있다는 걸, 가장 나쁜 방식으로 확인했다.'
        : '월드컵에 나갔다. 그 사실은 남는다.' }];
  },
});

ev({
  id: 'barca_revenge', once: true, when: (g) => hasMemory(g, 'rejection') && g.player.active && g.player.club && g.player.club.tier <= 3 && A(g) >= 20, w: () => 190,
  body: (g) => {
    const m = getMemory(g, 'rejection');

    return `이번 주말 상대는 ${foe}다.\n\n${m.age}세였던 ${m.year}년, 그곳에서 떨어졌다. 리포트에는 "지금 우리 시스템에 넣어야 할 필연성이 낮다"고 적혀 있었다.\n\n그때 평가서를 쓴 스카우트는 지금도 그 조직에 있다. 이번에 관중석에 온다고 한다.`;
  },
  choices: () => [
    { t: '이 한 경기에 모든 것을 건다.', tags: ['pride', 'ambition'],
      fx: (gg) => {
        const perf = gg.player.hidden.bigMatch + gg.player.hidden.grit * 0.4 + gg.rng.norm(0, 16);

        else { gg.player.confidence -= 10; gg.player.stress += 12; remember(gg, 'revenge_fail', `${gg.world.year}년, 그 팀 앞에서 아무것도 못 했다.`, 0.8); }
      },
      out: (gg) => gg.flags.revengeDone
        ? '골을 넣고 관중석 쪽을 한참 봤다. 누구를 보는지는 나만 알았다.'
        : '90분 동안 공을 다섯 번 잡았다. 경기 후 아무도 그 얘기를 꺼내지 않았다.' },
    { t: '평소처럼 한다. 10년 전 일이다.', tags: ['discipline'],
      fx: (gg) => { gg.player.stress -= 8; gg.player.form += 5; gg.player.trait.discipline += 6; },
      out: () => '경기가 끝나고 나서야, 손이 떨렸다는 걸 알았다.' },
  ],
});

ev({
  id: 'lifestyle', when: (g) => A(g) >= 19 && A(g) <= 30 && g.player.active && g.player.econ.wageYear > 100000, w: () => 70,
  body: (g) => `시즌 중 휴식기. 계좌에 ${money(g.player.econ.assets, ORIGINS[g.originId].currency)}가 있다. 스무 살 때는 상상도 못 한 금액이다.\n\n스트레스 ${Math.round(g.player.stress)}/100 · 컨디션 ${Math.round(g.player.fitness)}%`,
  choices: () => [
    { t: '전문 트레이너와 개인 회복 프로그램에 투자한다.', tags: ['discipline'],
      fx: (gg) => { gg.player.econ.assets -= 60000; gg.player.hidden.injuryProne -= 8; gg.player.fitness = clamp(gg.player.fitness + 14, 0, 100); gg.player.hidden.pro += 6; gg.flags.privateCoach = true; },
      out: () => '돈으로 살 수 있는 것 중에 가장 값싼 게 몸이었다.' },

      fx: (gg) => { gg.player.stress = clamp(gg.player.stress - 22, 0, 100); gg.player.fitness -= 12; gg.player.hidden.pro -= 6; if (gg.rng.chance(0.22)) { gg.flags.scandal = true; gg.player.reputation -= 8; gg.npcs.coach.trust -= 14; } },
      out: (gg) => gg.flags.scandal ? '새벽 4시 사진이 다음 날 신문에 실렸다.' : '머리가 비워졌다. 그것도 필요했다.' },
    { t: '가족에게 집을 사준다.', tags: ['family'],
      fx: (gg) => { gg.player.econ.assets -= 220000; gg.player.econ.householdMoney += 34; gg.npcs.father.trust += 18; gg.npcs.mother.trust += 20; gg.player.econ.familyInfluence += 18; gg.player.trait.familyBond += 12; gg.player.stress -= 10; },
      out: (gg) => { remember(gg, 'bought_house', `${gg.world.year}년, 부모님께 집을 사드렸다.`, 0.9, ['father', 'mother']); return '어머니가 현관에서 한참 울었다. 아버지는 아무 말 없이 방을 하나씩 돌아봤다.'; } },
  ],
});

ev({
  id: 'cousin_rivalry', when: (g) => g.npcs.cousin.stage >= 2 && A(g) >= 19 && g.player.active, w: () => 60, once: true,
  body: (g) => `사촌 ${g.npcs.cousin.name}가 여자 축구에서 급성장했다. 명성 ${Math.round(g.npcs.cousin.fame)}/100.\n\n명절 식탁에서 어른들이 둘의 기록을 비교한다. 지난달 인터뷰에서 그가 말했다.\n"저는 누구처럼 운이 좋진 않았어요. 다 제가 만들었죠."\n\n기자들이 이 구도를 좋아한다.`,
  choices: () => [
    { t: '공개적으로 그를 칭찬하고 같이 마케팅한다.', tags: ['adaptability'],
      fx: (gg) => {
        gg.player.econ.followers = Math.round(gg.player.econ.followers * 1.7 + gg.npcs.cousin.fame * 1200);
        gg.player.econ.endorsements = Math.round(gg.player.econ.endorsements * 1.4);
        gg.player.reputation += 5; gg.npcs.cousin.stage = 1; gg.flags.viralPR = true;
      },
      out: () => '둘이 함께 찍은 광고가 그해 최고 화제작이 됐다. 서로의 팔로워가 섞였다.' },
    { t: '기록으로만 대답한다.', tags: ['pride', 'discipline'],
      fx: (gg) => { gg.player.hidden.grit += 10; gg.player.stress += 8; gg.player.trait.pride += 8; },
      out: () => '인터뷰 요청을 전부 거절했다. 대신 그 시즌 개인 최다 공격포인트를 찍었다.' },
    { t: '무시한다. 가족 문제로 만들지 않는다.', tags: ['family'],
      fx: (gg) => { gg.player.stress -= 8; gg.player.trait.familyBond += 8; },
      out: () => '명절에 축구 얘기가 나오면 자리를 옮겼다.' },
  ],
});

ev({
  id: 'contract_renewal', when: (g) => A(g) >= 20 && g.player.active && g.player.club && g.world.year >= g.player.contractUntil - 1, w: () => 110,
  body: (g) => `${g.player.club.name}과의 계약이 ${g.player.contractUntil}년에 끝난다.\n구단이 재계약을 제시했다. 현재 연봉 ${money(g.player.econ.wageYear, ORIGINS[g.originId].currency)}.\n\n${g.npcs.agent ? `에이전트 ${g.npcs.agent.name}: ${g.npcs.agent.loyalty > 60 ? '"조건은 내가 올려볼게. 다만 여기 남는 게 축구적으로는 맞아."' : '"더 좋은 데 있어. 지금 나가야 내 수수료도... 아니, 네 커리어도 커져."'}` : ''}`,
  choices: () => [
    { t: '재계약한다. 안정을 택한다.', tags: ['safe'],
      fx: (gg) => { gg.player.contractUntil = gg.world.year + 4; gg.player.econ.wageYear = Math.round(gg.player.econ.wageYear * 1.45); gg.player.stress -= 8; gg.npcs.coach.trust += 6; },
      out: (gg) => `연봉 ${money(gg.player.econ.wageYear, ORIGINS[gg.originId].currency)}으로 4년 연장.` },
    { t: '주급 인상을 강하게 요구한다.', tags: ['pride', 'risk'],
      fx: (gg) => {
        const lev = gg.player.reputation + gg.npcs.coach.trust / 2 + (gg.npcs.agent ? gg.npcs.agent.loyalty / 4 : 0);
        if (lev > 95) { gg.player.econ.wageYear = Math.round(gg.player.econ.wageYear * 2.1); gg.player.contractUntil = gg.world.year + 4; gg.player.econ.familyInfluence += 10; }
        else { gg.npcs.coach.trust -= 16; gg.player.stress += 12; gg.flags.contractStandoff = true; }
      },
      out: (gg) => gg.flags.contractStandoff
        ? '구단이 제안을 철회했다. 팬들은 "돈만 아는 선수"라고 쓴다.'
        : `요구가 통했다. 연봉 ${money(gg.player.econ.wageYear, ORIGINS[gg.originId].currency)}.` },
    { t: '계약을 흘려서 자유계약(FA)으로 나간다.', tags: ['risk', 'ambition'],
      fx: (gg) => { gg.flags.goingFA = true; gg.npcs.coach.trust -= 20; gg.player.stress += 14; },
      out: () => '이적료 없이 나갈 수 있다. 대신 이번 시즌 내내 팬들의 야유를 듣는다.' },
  ],
});

ev({
  id: 'captaincy', once: true, when: (g) => A(g) >= 25 && g.player.active && g.player.club && g.npcs.coach.trust > 68 && g.player.reputation > 45, w: () => 90,
  body: (g) => `감독이 주장 완장을 제안한다. ${g.player.club.name}에서 가장 오래된 선수가 됐다는 뜻이기도 하다.`,
  choices: () => [
    { t: '받는다.', tags: ['pride', 'discipline'],
      fx: (gg) => { gg.flags.captain = true; gg.player.hidden.bigMatch += 8; gg.player.hidden.pro += 8; gg.player.reputation += 6; gg.player.stress += 12; gg.player.career.trophies.push(`${gg.player.club.name} 주장`); },
      out: (gg) => { remember(gg, 'captain', `${gg.world.year}년 ${gg.player.club.name} 주장이 됐다.`, 0.8); return '완장을 차고 처음 라커룸에서 말을 했다. 목소리가 떨렸다.'; } },
    { t: '거절한다. 내 경기에 집중하고 싶다.', tags: ['safe'],
      fx: (gg) => { gg.player.stress -= 6; gg.npcs.coach.trust -= 6; },
      out: () => '완장은 다른 선수에게 갔다. 후회는 나중에 온다.' },
  ],
});

/* ── 황혼기 (30~36) ────────────────────────────────────────────── */

ev({
  id: 'aging', when: (g) => A(g) >= 30 && g.player.active && g.player.club, w: () => 130,
  body: (g) => `만 ${A(g)}세. 회복이 느려졌다. 어제 경기 다음 날 종아리가 이틀을 아프다.\n감독은 로테이션을 말하기 시작했다.\n\n현재 ${g.player.club.name} · 평판 ${Math.round(g.player.reputation)}/100 · 누적 자산 ${money(g.player.econ.assets, ORIGINS[g.originId].currency)}`,
  choices: (g) => {
    const list = [
      { t: '주전 경쟁을 계속한다.', tags: ['pride'],
        fx: (gg) => { gg.player.stress += 12; gg.npcs.coach.trust -= 4; gg.player.hidden.injuryProne += 6; },
        out: () => '아직 진 게 아니다. 다만 예전보다 훨씬 아프다.' },
      { t: '베테랑 역할을 받아들인다. 로테이션 + 리더십.', tags: ['adaptability', 'discipline'],
        fx: (gg) => { gg.npcs.coach.trust += 14; gg.player.stress -= 10; gg.player.hidden.injuryProne -= 6; gg.player.profile.tactical += 4; gg.flags.veteran = true; },
        out: () => '20분씩 나가서 경기를 정리한다. 어린 선수들이 질문을 하러 온다.' },
    ];
    const lucrative = CLUBS.filter((c) => ['MLS', 'J-League', 'K-League'].includes(c.league) && c.tier >= 3);
    if (lucrative.length && g.player.reputation > 45) list.push({
      t: `${g.rng.pick(['MLS', 'J-League'])} 고액 계약으로 떠난다.`, tags: ['safe', 'risk'],
      fx: (gg) => {
        const c = gg.rng.pick(lucrative);
        joinClub(gg, c, { years: 3, wanted: true });
        gg.player.econ.wageYear = Math.round(gg.player.econ.wageYear * 1.3);
        gg.player.econ.assets += 400000;
        gg.npcs.coach.trust = 78;
      },
      out: (gg) => `${gg.player.club.name}. 축구 수준은 내려갔고, 통장과 삶의 질은 올라갔다.` });
    return list;
  },
});

ev({
  id: 'father_callback', once: true, when: (g) => A(g) >= 31 && hasMemory(g, 'promise_school') && g.player.active, w: () => 120,
  body: (g) => {
    const m = getMemory(g, 'promise_school');
    return `아버지와 저녁을 먹는다. 이제 그는 늙었다.\n\n"${m.year}년에 네가 성적 유지한다고 해서 축구 시켜준 거 기억나냐."\n\n잠시 말이 없다가,\n\n"그때 내가 반대만 했으면… 지금 너는 어디 있었을까 싶다."\n\n${hasMemory(g, 'bought_house') ? '식탁은 내가 사준 집의 부엌에 있다.' : '식탁은 30년 된 그 집의 부엌에 있다.'}`;
  },
  choices: () => [
    { t: '"아버지가 허락해줘서 여기까지 온 거예요."', tags: ['family'],
      fx: (gg) => { gg.npcs.father.trust = 98; gg.player.stress -= 14; gg.player.trait.familyBond += 14; gg.flags.fatherResolved = true; },
      out: (gg) => { remember(gg, 'father_resolved', '아버지와 화해했다. 30년 걸렸다.', 0.95, ['father']); return '아버지가 고개를 끄덕이고 접시를 치웠다. 그게 그 사람의 방식이다.'; } },
    { t: '"저는 아버지 허락 없어도 했을 거예요."', tags: ['pride'],
      fx: (gg) => { gg.npcs.father.trust -= 8; gg.player.trait.pride += 10; },
      out: () => '아버지가 웃었다. "그래, 너는 그랬겠지." 그 대답이 칭찬인지 아닌지는 알 수 없었다.' },
  ],
});

ev({
  id: 'retirement', when: (g) => A(g) >= 33 && g.player.active, w: (g) => 60 + (A(g) - 33) * 90 + (g.player.ovr < 60 ? 70 : 0),
  body: (g) => `만 ${A(g)}세. 은퇴를 생각하기 시작했다.\n\n통산 ${g.player.career.apps}경기 ${g.player.career.goals}골 ${g.player.career.assists}도움 · A매치 ${g.player.career.caps}경기\n누적 자산 ${money(g.player.econ.assets, ORIGINS[g.originId].currency)} · 가문 내 영향력 ${Math.round(g.player.econ.familyInfluence)}%`,
  choices: (g) => [
    { t: '한 시즌 더 뛴다.', tags: ['pride'],
      fx: (gg) => { gg.player.stress += 8; }, out: () => '"마지막 한 시즌." 이 말도 몇 번째다.' },
    { t: '이번 시즌을 마지막으로 정하고 은퇴를 발표한다.', tags: ['discipline'],
      fx: (gg) => { gg.flags.farewellSeason = true; gg.player.reputation += 6; gg.player.stress -= 12; },
      out: () => '발표한 다음 경기, 원정 관중석에서도 박수가 나왔다.' },
    { t: '지도자 자격증을 준비하며 마무리한다.', tags: ['adaptability', 'discipline'],
      fx: (gg) => { gg.flags.coachingLicense = true; gg.flags.farewellSeason = true; gg.player.academicLevel += 10; },
      out: (gg) => { remember(gg, 'coaching', 'UEFA 지도자 코스를 시작했다.', 0.7); return '전술 노트를 다시 쓰기 시작했다. 이번에는 남을 위해서.'; } },
  ],
});

/* ── 축구를 그만둔 뒤 ──────────────────────────────────────── */

ev({
  id: 'after_quit', when: (g) => !g.player.active && !g.player.retired && A(g) <= 26, w: () => 999,
  body: (g) => {
    const yearsSince = A(g) - (getMemory(g, 'quit')?.age ?? A(g));
    return yearsSince <= 1
      ? '축구를 그만뒀다. 처음 몇 달은 홀가분했고, 그 다음 몇 달은 견디기 어려웠다.'
      : `축구 없이 ${yearsSince}년을 살았다. 가끔 동네 경기장 옆을 지나면 발이 멈춘다.`;
  },
  choices: (g) => {
    const list = [
      { t: '학업/커리어에 집중한다.', tags: ['safe'],
        fx: (gg) => { gg.player.academicLevel += 12; gg.player.econ.assets += 18000; },
        out: () => '평범한 삶이 생각보다 나쁘지 않다.' },
      { t: '동네 팀에서 다시 공을 찬다.', tags: ['family'],
        fx: (gg) => { gg.player.willToPlay += 14; gg.player.stress -= 10; },
        out: () => '수요일 저녁 리그. 아무도 스카우트하지 않지만, 이게 축구다.' },
    ];
    if (g.player.willToPlay > 55 && A(g) <= 23 && g.player.ovr > 45) list.push({
      t: '다시 도전한다. 하부 리그 트라이아웃.', tags: ['ambition', 'risk'],
      fx: (gg) => {
        const ok = gg.rng.chance(0.3 + (gg.player.ovr - 50) / 90);
        if (ok) {
          gg.player.active = true;
          const low = CLUBS.filter((c) => c.tier >= 5 && c.c === gg.player.nationality);
          joinClub(gg, low.length ? gg.rng.pick(low) : clubById('terrassa'), { years: 2 });
          remember(gg, 'comeback', `${gg.world.year}년, 축구로 돌아왔다.`, 0.9);
        } else { gg.player.willToPlay -= 20; }
      },
      out: (gg) => gg.player.active
        ? '세미프로 계약. 주급은 아르바이트 수준이다. 다시 선수다.'
        : '트라이아웃에서 떨어졌다. 이번에는 담담했다.' });
    return list;
  },
});

/* ── 범용 필러 ────────────────────────────────────────────── */

ev({
  id: 'training_focus', when: (g) => g.player.active && A(g) >= 9 && A(g) <= 32, w: () => 45,
  body: (g) => `이번 기간의 훈련 방향을 정한다.\n\n${g.player.club ? `${g.player.club.name} · 감독 신뢰 ${Math.round(g.npcs.coach.trust)}/100` : '무소속'} · 컨디션 ${Math.round(g.player.fitness)}% · 스트레스 ${Math.round(g.player.stress)}/100`,
  choices: () => [
    { t: '기술 반복 훈련', tags: ['discipline'],
      fx: (gg) => { gg.player.profile.dribble += 2; gg.player.profile.pass += 1.5; gg.player.hidden.absorption += 2; },
      out: () => '지겹다. 그리고 효과가 있다.' },
    { t: '피지컬/스프린트', tags: [],
      fx: (gg) => { gg.player.profile.pace += 2; gg.player.profile.physical += 2; gg.player.fitness = clamp(gg.player.fitness + 6, 0, 100); gg.player.hidden.injuryProne += 3; },
      out: () => '몸이 단단해졌다. 대신 근육이 계속 뭉친다.' },
    { t: '영상 분석 / 전술 공부', tags: ['discipline'],
      fx: (gg) => { gg.player.profile.tactical += 2.5; gg.player.profile.decision += 2; gg.npcs.coach.trust += 5; },
      out: () => '경기장이 조금 더 넓게 보인다.' },
    { t: '쉰다. 몸을 회복시킨다.', tags: ['safe'],
      fx: (gg) => { gg.player.fitness = clamp(gg.player.fitness + 14, 0, 100); gg.player.stress = clamp(gg.player.stress - 14, 0, 100); gg.player.hidden.injuryProne -= 4; gg.flags.overtrain = false; },
      out: () => '아무것도 하지 않는 것도 훈련이다. 스물다섯이 되어서야 배웠다.' },
  ],
});

/* ─────────────────────────── 12. 턴 루프 ─────────────────────────── */

function eligibleEvents(g) {
  const out = [];
  for (const e of EVENTS) {
    if (e.once && g.flags[`_done_${e.id}`]) continue;
    let ok = false;
    try { ok = e.when(g); } catch { ok = false; }
    if (!ok) continue;
    let w = 0;
    try { w = e.w(g); } catch { w = 0; }
    if (w <= 0) continue;
    out.push({ w, e });
  }
  return out;
}

function beginTurn(g) {
  if (g.over) return g;
  g.turn++;
  const age = ageOf(g);

  pushLog(g, 'period', periodLabel(g));

  // 역사 이벤트 배너
  const h = HISTORY[g.world.year];
  if (h && g.world.phase === 'SUMMER' && !g.flags[`_hist_${g.world.year}`]) {
    g.flags[`_hist_${g.world.year}`] = true;
    pushLog(g, 'history', `◆ ${h.title}`);
  }

  // 기간 시뮬레이션
  applyGrowth(g);
  simulatePeriod(g);
  simulateWorld(g);
  nationalTeamCheck(g);

  // 무소속 청소년은 자동으로 동네/학교 팀에 들어간다
  if (!g.player.club && g.player.active && age >= 10 && age <= 15) {
    const local = isESP(g)
      ? { id: 'street', name: '동네 클럽 유소년팀', league: 'Barcelona 지역리그', c: 'ESP', tier: 6, train: 52, comp: 46, expo: 24, wage: 0 }
      : { id: 'rec', name: 'AYSO 리크리에이션', league: 'AYSO', c: 'USA', tier: 6, train: 38, comp: 34, expo: 12, wage: 0 };
    joinClub(g, local, { years: 6 });
  }

  // 은퇴 / 종료 판정
  if (age >= 37 || (g.flags.farewellSeason && age >= 33 && g.world.phase === 'SUMMER' && g.flags._farewellDone)) {
    return finish(g);
  }
  if (g.flags.farewellSeason && !g.flags._farewellDone) g.flags._farewellDone = true;
  if (!g.player.active && age >= 27) return finish(g);

  // 이벤트 선택
  const pool = eligibleEvents(g);
  const picked = g.rng.weighted(pool);
  if (!picked) {
    // 유년기의 빈 해에 클릭을 요구하면 그게 곧 피로도다. 조용히 넘긴다.
    if (age <= 8 && g.turn < 60) {
      pushLog(g, 'system', '별일 없이 한 해가 지나갔다.');
      advanceClock(g);
      return beginTurn(g);
    }
    g.pending = {
      id: 'quiet', title: '조용한 기간',
      body: '특별한 일 없이 지나갔다. 훈련하고, 먹고, 잤다. 커리어의 대부분은 이런 기간이다.',
      choices: [{ t: '다음 기간으로.', tags: [], fx: () => {}, out: () => '' }],
    };
    return g;
  }
  const e = picked.e;
  if (e.once) g.flags[`_done_${e.id}`] = true;
  const body = e.body(g);
  const choices = e.choices(g);
  g.pending = { id: e.id, title: e.title || null, body, choices, _after: e.after };
  return g;
}

function choose(g, index) {
  if (g.over || !g.pending) return g;
  const ch = g.pending.choices[index];
  if (!ch) return g;

  pushLog(g, 'event', g.pending.body);
  pushLog(g, 'choice', `▸ ${ch.t}`);

  // 성격 형성 — 선택의 태그가 성격을 만든다
  const map = { ambition: 'ambition', pride: 'pride', family: 'familyBond', risk: 'risk', discipline: 'discipline', adaptability: 'adaptability', safe: null };
  for (const tag of ch.tags || []) {
    const key = map[tag];
    if (key) g.player.trait[key] = clamp(g.player.trait[key] + 4, 0, 100);
    if (tag === 'safe') g.player.trait.risk = clamp(g.player.trait.risk - 3, 0, 100);
  }

  try { ch.fx(g); } catch (err) { /* 이벤트 오류가 게임을 죽이지 않게 */ }
  let outText = '';
  try { outText = ch.out(g) || ''; } catch { outText = ''; }
  if (outText) pushLog(g, 'outcome', outText);

  const after = g.pending._after;
  g.pending = null;
  if (after) { try { after(g); } catch {} }

  // 히든 수치 정리
  const hd = g.player.hidden;
  for (const k of ['injuryProne', 'bigMatch', 'adaptability', 'grit', 'absorption', 'consistency', 'pro']) hd[k] = clamp(hd[k], 3, 99);
  g.player.willToPlay = clamp(g.player.willToPlay, 0, 100);
  g.player.stress = clamp(g.player.stress, 0, 100);
  g.player.confidence = clamp(g.player.confidence, 0, 100);
  g.player.fitness = clamp(g.player.fitness, 20, 100);
  g.player.econ.householdMoney = clamp(g.player.econ.householdMoney, 0, 100);
  g.world.parentBuyIn = clamp(g.world.parentBuyIn, 0, 100);

  // 후속 이벤트가 즉시 필요한 경우(테스트 결과 등)는 시간을 넘기지 않는다
  const chain = EVENTS.find((e) => {
    if (e.id !== 'trial_result' && e.id !== 'youth_offers' && e.id !== 'after_quit') return false;
    if (e.once && g.flags[`_done_${e.id}`]) return false;
    try { return e.when(g); } catch { return false; }
  });
  if (chain) {
    if (chain.once) g.flags[`_done_${chain.id}`] = true;
    g.pending = { id: chain.id, title: chain.title || null, body: chain.body(g), choices: chain.choices(g), _after: chain.after };
    return g;
  }

  advanceClock(g);
  return beginTurn(g);
}

/* ─────────────────────────── 13. 엔딩 / 커리어 전기 ─────────────────────────── */

/**
 * 도달한 최고 클럽 티어. 성인 무대(17세 이상)에서 실제로 뛴 시즌만 센다.
 * 유소년 경기를 포함하면 "라 마시아 U15에서 뛴 아이"가 세계 최상위 도달로 잡힌다.
 */
function peakSeniorTier(g) {
  return g.player.career.seasons.reduce((best, s) => {
    if (s.age < 17 || s.apps < 8) return best;
    const c = CLUBS.find((x) => x.name === s.club);
    return c ? Math.min(best, c.tier) : best;
  }, 9);
}

function classify(g) {
  const p = g.player;
  const peakTier = peakSeniorTier(g);
  const apps = p.career.apps;

  // 순서가 곧 우선순위다. 부상/중단은 도달 수준보다 먼저 판정한다.
  if (g.flags.injuryEnded) return 'INJURY_OUT';
  if (hasMemory(g, 'quit') && apps < 60) return 'QUIT';
  // 전성기 평판으로 판정한다. 36세의 평판은 이미 내려앉아 있다.
  if (peakTier <= 1 && (p.peakReputation || 0) > 72) return 'WORLD_CLASS';
  if (peakTier <= 2 && apps > 200) return 'TOP_FLIGHT';
  if (peakTier <= 3 && apps > 150) return 'PRO';
  if (peakTier <= 4 && apps > 80) return 'SECOND_DIV';
  if (g.flags.ncaa && peakTier >= 5) return 'COLLEGE';
  // 지도자 전환: 선수로는 하위 리그에서 끝났지만 축구 안에 남은 커리어.
  // 아마추어(티어 6)에 머문 인생을 덮지는 않는다 — 그건 그 자체로 결론이다.
  if (g.flags.coachingLicense && apps > 60 && peakTier <= 5) return 'COACH';
  if (peakTier <= 5 && apps > 60) return 'SEMI_PRO';
  return 'NEVER_MADE_IT';
}

const ENDING_LABELS = {
  WORLD_CLASS: { t: 'All-Time Great', d: '세계 최상위에서 커리어를 보냈다. 이 이름은 남는다.' },

  SEMI_PRO: { t: 'Semi-Pro', d: '주급으로는 부족했다. 그래도 선수였다.' },

function finish(g) {
  const p = g.player;
  g.over = true;
  p.retired = true;
  const key = classify(g);
  const label = ENDING_LABELS[key];
  const cur = ORIGINS[g.originId].currency;

  const turning = g.memories.slice().sort((a, b) => b.importance - a.importance)[0];
  const regret = g.memories.filter((m) => ['major_injury', 'youth_major_injury', 'wc_flop', 'revenge_fail', 'money_wall', 'quit'].includes(m.tag))
    .sort((a, b) => b.importance - a.importance)[0];
  const keyPerson = hasMemory(g, 'mother_sacrifice') ? '어머니'
    : hasMemory(g, 'sibling_saved_family') ? '형'
    : hasMemory(g, 'father_resolved') || hasMemory(g, 'promise_school') ? '아버지'
    : g.npcs.rival.name;

  g.ending = {
    key, ...label,
    bio: {
      name: p.name,
      span: `1990–${g.world.year}`,
      origin: `${ORIGINS[g.originId].flag} ${ORIGINS[g.originId].city}`,
      parents: PARENTS[g.parentId].label,
      position: POSITIONS[p.position].label,
      path: p.path,
      apps: p.career.apps, goals: p.career.goals, assists: p.career.assists,
      caps: p.career.caps, ntGoals: p.career.ntGoals, ntTeam: p.ntTeam || '없음',
      trophies: p.career.trophies,
      assets: money(p.econ.assets, cur),
      followers: num(p.econ.followers),
      familyInfluence: `${Math.round(p.econ.familyInfluence)}%`,
      revealedPotential: p.hidden.potential, // 커리어 종료 시점에만 공개
      peakOvr: Math.round(p.peakOvr),
      finalOvr: Math.round(p.ovr),
      unrealized: Math.max(0, Math.round(p.hidden.potential - p.peakOvr)),
      turning: turning ? `${turning.year}년 — ${turning.text}` : '없음',
      regret: regret ? `${regret.year}년 — ${regret.text}` : '없음',
      keyPerson,
      rival: `${g.npcs.rival.name} (${g.npcs.rival.club || '무소속'}, A매치 ${g.npcs.rival.caps}경기)`,

  pushLog(g, 'header', `커리어 종료 — ${label.t}`);

  g.pending = null;
  return g;
}

/* ─────────────────────────── 15. 자동 플레이 / 배치 ─────────────────────────── */

/** 성격 기반 선택 효용 — NPC/자동 시뮬레이션용 결정 매트릭스 */
function scoreChoice(g, ch) {
  const t = g.player.trait;
  let s = 10 + g.rng.norm(0, 3);
  for (const tag of ch.tags || []) {
    if (tag === 'ambition') s += (t.ambition - 45) * 0.22;
    if (tag === 'pride') s += (t.pride - 45) * 0.18;
    if (tag === 'family') s += (t.familyBond - 45) * 0.22;
    if (tag === 'risk') s += (t.risk - 50) * 0.20;
    if (tag === 'discipline') s += (t.discipline - 45) * 0.20;
    if (tag === 'adaptability') s += (t.adaptability - 45) * 0.18;
    if (tag === 'safe') s += (55 - t.risk) * 0.16 + (g.player.econ.householdMoney < 30 ? 3 : 0);
  }
  return s;
}

function autoStep(g) {
  if (g.over || !g.pending) return g;
  const scored = g.pending.choices.map((c, i) => ({ i, s: scoreChoice(g, c) }));
  scored.sort((a, b) => b.s - a.s);
  // 최상위를 항상 고르지 않는다 — 인간은 최적화 기계가 아니다
  const pickIdx = g.rng.chance(0.72) ? scored[0].i : g.rng.pick(scored).i;
  return choose(g, pickIdx);
}

function autoPlay(g, maxTurns = 400) {
  let n = 0;
  while (!g.over && n++ < maxTurns) autoStep(g);
  if (!g.over) finish(g);
  return g;
}

/** N회 자동 시뮬레이션 → 결과 분포. 엔진 검증용. */
function batch(n = 1000, opts = {}) {
  const counts = {};
  const tiers = {};
  const samples = [];
  const baseSeed = opts.seed ?? 12345;
  for (let i = 0; i < n; i++) {
    const g = newGame({ ...opts, seed: (baseSeed + i * 7919) | 0 });
    autoPlay(g);
    const k = g.ending.key;
    counts[k] = (counts[k] || 0) + 1;
    const pt = peakSeniorTier(g);
    tiers[pt] = (tiers[pt] || 0) + 1;
    if (samples.length < (opts.keepSamples ?? 12)) {
      samples.push({
        seed: g.seed, name: g.player.name, ending: g.ending.key,
        pot: g.player.hidden.potential, peak: Math.round(g.player.peakOvr), finalOvr: Math.round(g.player.ovr),
        apps: g.player.career.apps, goals: g.player.career.goals, caps: g.player.career.caps,
        path: g.player.path.join(' → '),
      });
    }
  }
  return { n, counts, tiers, samples };
}

    render();
  };
  const bt = el('button', 'btn ghost', '엔진 검증 (자동 시뮬 1,000회)');
  bt.onclick = () => { UI.screen = 'batch'; render(); };
  r.appendChild(start);
  r.appendChild(seedIn);
  r.appendChild(bt);
  c3.appendChild(r);
  c3.appendChild(el('div', 'muted', '같은 seed = 같은 인생. 비워두면 무작위.'));
  root.appendChild(c3);
  root.appendChild(footer());
}

function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 1;
}

function masthead() {
  const m = el('div', 'masthead');
  const h = el('h1');
  h.appendChild(el('span', null, 'Project'));
  h.appendChild(document.createTextNode(' 1990'));
  m.appendChild(h);
  m.appendChild(el('div', 'sub', 'Football Life Simulation · 1990—2026'));
  return m;
}
function footer() {
  const f = el('div', 'foot');
  f.textContent = '엔진은 결과를 결정한다. 텍스트는 그 결과를 설명한다. · 구단명은 실제 명칭이며 모든 수치는 창작 밸런스 값이다.';
  return f;
}

/* ─────────────── 대시보드 ─────────────── */

function kv(k, v, cls) {
  const r = el('div', 'kv');
  r.appendChild(el('span', 'k', k));
  r.appendChild(el('span', 'v' + (cls ? ' ' + cls : ''), v));
  return r;
}
function sec(label) {
  const s = el('div', 'dsec');
  s.appendChild(el('div', 'lbl', label));
  return s;
}

function renderDash(g) {
  const d = dashboard(g);
  const card = el('div', 'card dash');
  card.appendChild(el('div', 'period', d.period));
  card.appendChild(el('div', 'who', `${g.player.name} · 만 ${d.age}세`));
  card.appendChild(el('div', 'club', `${d.club}\n${d.league} · ${d.position}`));

  const s0 = sec('컨디션');
  s0.appendChild(kv('폼(Form)', '★'.repeat(Math.max(1, Math.round(d.form / 20))) + '☆'.repeat(5 - Math.max(1, Math.round(d.form / 20)))));
  s0.appendChild(kv('사기', d.morale, d.morale === '최상' ? 'good' : d.morale === '불안' || d.morale === '흔들림' ? 'warn' : ''));
  s0.appendChild(kv('신체 상태', d.fitness, d.fitness.includes('부상') ? 'bad' : 'good'));
  s0.appendChild(kv('기간 기록', d.seasonLine, 'mute'));
  card.appendChild(s0);

  const s1 = sec('Visible Stats (1~20)');
  for (const k of Object.keys(d.stats)) {
    // 12/20 이상은 프로 수준으로 본다 — 눈에 바로 들어오게 강조색을 준다
    const row = el('div', 'stat' + (d.stats[k] >= 12 ? ' hi' : ''));
    row.appendChild(el('div', 'sl', STAT_LABELS[k]));
    const bar = el('div', 'sb');
    const fill = el('i');
    fill.style.width = `${(d.stats[k] / 20) * 100}%`;
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el('div', 'sv', String(d.stats[k])));
    s1.appendChild(row);
  }
  s1.appendChild(kv('잠재력 (PA)', d.potential, 'mute'));
  card.appendChild(s1);

  const s2 = sec('Socio-Economic');
  s2.appendChild(kv('기본 연봉', d.econ.wage));
  s2.appendChild(kv('누적 자산', d.econ.assets));
  s2.appendChild(kv('광고 수입', d.econ.endorsements));
  s2.appendChild(kv('SNS 팔로워', d.econ.followers));
  s2.appendChild(kv('가문 내 영향력', d.econ.familyInfluence, Number(d.econ.familyInfluence.replace('%', '')) > 50 ? 'good' : ''));
  card.appendChild(s2);

  const s3 = sec('관계');
  s3.appendChild(kv('아버지', String(d.social.father)));
  s3.appendChild(kv('어머니', String(d.social.mother)));
  s3.appendChild(kv('감독 신뢰', String(d.social.coach), d.social.coach > 65 ? 'good' : d.social.coach < 35 ? 'bad' : ''));
  if (d.age <= 20) s3.appendChild(kv('부모의 축구 수용도', String(d.social.parentBuyIn), d.social.parentBuyIn < 35 ? 'bad' : ''));
  s3.appendChild(kv('라이벌', d.social.rival, 'mute'));
  s3.appendChild(kv('사촌', d.social.cousin, 'mute'));
  card.appendChild(s3);

  const s4 = sec('통산');
  s4.appendChild(kv('경기 / 골 / 도움', `${d.career.apps} / ${d.career.goals} / ${d.career.assists}`));
  s4.appendChild(kv('A매치', String(d.career.caps)));
  s4.appendChild(kv('평판', String(d.career.reputation)));
  card.appendChild(s4);

  card.appendChild(el('div', 'hidden-note',
    'Hidden: 잠재력 · 유리몸 지수 · 빅매치 멘탈 · 적응력 · 독기는 플레이 중 열람할 수 없다.'));
  return card;
}

/* ─────────────── 게임 화면 ─────────────── */

function renderGame() {
  const g = UI.game;
  const root = $('#app');
  root.innerHTML = '';
  root.appendChild(masthead());

  const stage = el('div', 'stage');
  stage.appendChild(renderDash(g));

  const right = el('div');
  const logCard = el('div', 'card');
  const log = el('div', 'log');
  for (const b of g.log) {
    const blk = el('div', 'blk ' + b.kind);
    blk.textContent = b.text;
    log.appendChild(blk);
  }
  logCard.appendChild(log);

  if (g.pending) {
    const ch = el('div', 'choices');
    g.pending.choices.forEach((c, i) => {
      const b = el('button', 'choice-btn');
      b.appendChild(el('span', 'n', `[${i + 1}]`));
      b.appendChild(el('span', null, c.t));
      b.onclick = () => { choose(g, i); render(); };
      ch.appendChild(b);
    });
    logCard.appendChild(ch);
  }
  right.appendChild(logCard);

  const tools = el('div', 'card');
  const tr = el('div', 'row');
  if (ageOf(g) <= 7) {
    const skip = el('button', 'btn ghost', '유년기 빠르게 넘기기 (8세까지 자동)');
    skip.onclick = () => { while (!g.over && ageOf(g) < 8) autoStep(g); render(); };
    tr.appendChild(skip);
  }
  const auto1 = el('button', 'btn ghost', '이 턴 자동 선택');
  auto1.onclick = () => { autoStep(g); render(); };
  const restart = el('button', 'btn ghost', '처음부터');
  restart.onclick = () => { UI.screen = 'start'; UI.game = null; render(); };
  tr.appendChild(auto1);
  tr.appendChild(restart);
  tools.appendChild(tr);
  tools.appendChild(el('div', 'muted', `seed ${g.seed} · turn ${g.turn} · 가변형 타임라인: ${cadenceOf(ageOf(g)) === 'HALF' ? '반년 단위 (16~29세)' : '1년 단위'}`));
  right.appendChild(tools);

  stage.appendChild(right);
  root.appendChild(stage);
  root.appendChild(footer());
  requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
}

/* ─────────────── 엔딩 화면 ─────────────── */

function renderEnding() {
  const g = UI.game;
  const b = g.ending.bio;
  const root = $('#app');
  root.innerHTML = '';
  root.appendChild(masthead());

  const k = el('div', 'card ending-key');
  k.appendChild(el('div', 'k', g.ending.t));
  k.appendChild(el('div', 'd', g.ending.d));
  root.appendChild(k);

  const c = el('div', 'card bio');
  c.appendChild(el('h2', null 	, 'Career Biography'));
  const g2 = el('div', 'grid2');
  const L = el('div'), R = el('div');
  L.appendChild(kv('이름', b.name));
  L.appendChild(kv('생몰', b.span));
  L.appendChild(kv('출생', b.origin));
  L.appendChild(kv('가정', b.parents));
  L.appendChild(kv('포지션', b.position));
  L.appendChild(kv('통산 경기', String(b.apps)));
  L.appendChild(kv('골 / 도움', `${b.goals} / ${b.assists}`));
  L.appendChild(kv('대표팀', `${b.ntTeam} — ${b.caps}경기 ${b.ntGoals}골`));
  R.appendChild(kv('누적 자산', b.assets));
  R.appendChild(kv('SNS 팔로워', b.followers));
  R.appendChild(kv('가문 내 영향력', b.familyInfluence));
  R.appendChild(kv('최종 능력', String(b.finalOvr), 'mute'));
  R.appendChild(kv('전성기 능력', String(b.peakOvr), 'good'));
  R.appendChild(kv('잠재력 (PA) — 최초 공개', String(b.revealedPotential), 'warn'));
  R.appendChild(kv('쓰지 못한 재능', `-${b.unrealized}`, b.unrealized > 12 ? 'bad' : 'mute'));
  R.appendChild(kv('라이벌', b.rival, 'mute'));
  g2.appendChild(L); g2.appendChild(R);
  c.appendChild(g2);

  const s = sec('커리어 경로');
  s.appendChild(el('div', 'muted', b.path.join('  →  ') || '기록 없음'));
  c.appendChild(s);

  if (b.trophies.length) {
    const t = sec('주요 이력');
    t.appendChild(el('div', 'muted', b.trophies.join(' · ')));
    c.appendChild(t);
  }

  const q = sec('결정적 장면');
  q.appendChild(kv('전환점', b.turning));
  q.appendChild(kv('가장 후회되는 순간', b.regret));
  q.appendChild(kv('가장 중요했던 사람', b.keyPerson));
  q.appendChild(kv('사촌', b.cousin));
  c.appendChild(q);
  root.appendChild(c);

  const tl = el('div', 'card');
  tl.appendChild(el('h2', null, '인생 타임라인'));
  const line = el('div', 'timeline');
  for (const m of b.memories) {
    const row = el('div', 'tl' + (m.importance >= 0.8 ? ' big' : ''));
    row.appendChild(el('div', 'yr', `${m.year}년 · 만 ${m.age}세`));
    row.appendChild(el('div', 'tx', m.text));
    line.appendChild(row);
  }
  if (!b.memories.length) line.appendChild(el('div', 'muted', '기록된 기억이 없다.'));
  tl.appendChild(line);
  root.appendChild(tl);

  const act = el('div', 'card');
  const r = el('div', 'row');
  const again = el('button', 'btn primary', '다른 인생을 살아본다');
  again.onclick = () => { UI.screen = 'start'; UI.game = null; render(); };
  const same = el('button', 'btn ghost', '같은 조건으로 한 번 더');
  same.onclick = () => {
    UI.game = newGame({ origin: UI.pick.origin, parents: UI.pick.parents, seed: (Math.random() * 2 ** 31) | 0 });
    UI.screen = 'game'; render();
  };
  r.appendChild(again); r.appendChild(same);
  act.appendChild(r);
  act.appendChild(el('div', 'muted', `seed ${g.seed} — 이 인생을 다시 보려면 이 숫자를 입력하면 된다.`));
  root.appendChild(act);
  root.appendChild(footer());
  window.scrollTo(0, 0);
}

/* ─────────────── 배치 검증 화면 ─────────────── */

const ORDER = ['WORLD_CLASS', 'TOP_FLIGHT', 'PRO', 'SECOND_DIV', 'SEMI_PRO', 'COLLEGE', 'INJURY_OUT', 'COACH', 'QUIT', 'NEVER_MADE_IT'];

function renderBatch() {
  const root = $('#app');
  root.innerHTML = '';
  root.appendChild(masthead());

  const info = el('div', 'card');
  info.appendChild(el('h2', null, '엔진 검증 — 플레이어 UI보다 먼저 만들어야 하는 도구'));
  info.appendChild(el('div', 'muted',
    '"1990년생 아이를 36세까지 N번 자동 시뮬레이션했을 때, 매번 다른 이야기가 나오는가?"\n' +
    '같은 엔진에 서로 다른 출생 조건을 넣었을 때 결과 분포가 실제로 갈라지는지가 이 프로젝트의 1차 검증 기준이다.'));
  const r = el('div', 'row');
  const n = el('input'); n.type = 'number'; n.value = '1000'; n.min = '50'; n.max = '5000';
  const run = el('button', 'btn primary', '두 지역 비교 실행');
  const back = el('button', 'btn ghost', '← 돌아가기');
  back.onclick = () => { UI.screen = 'start'; render(); };
  const out = el('div');
  run.onclick = () => {
    run.disabled = true;
    out.innerHTML = '';
    const sp = el('div', 'muted'); sp.innerHTML = '<span class="spin"></span> 시뮬레이션 중…';
    out.appendChild(sp);
    setTimeout(() => {
      out.innerHTML = '';
      const cnt = Math.max(50, Math.min(5000, Number(n.value) || 1000));
      for (const o of ['ESP', 'USA']) {
        const t0 = performance.now();
        const res = batch(cnt, { origin: o, parents: UI.pick.parents, keepSamples: 5 });
        out.appendChild(batchCard(o, res, performance.now() - t0));
      }
      run.disabled = false;
    }, 30);
  };
  r.appendChild(run); r.appendChild(n); r.appendChild(back);
  info.appendChild(r);
  root.appendChild(info);
  root.appendChild(out);
  root.appendChild(footer());
}

function batchCard(originId, res, ms) {
  const o = ORIGINS[originId];
  const c = el('div', 'card');
  c.appendChild(el('h2', null, `${o.flag} ${o.label} — ${res.n} playthroughs (${Math.round(ms)}ms)`));
  for (const k of ORDER) {
    const n = res.counts[k] || 0;
    const pct = (n / res.n) * 100;
    const row = el('div', 'brow');
    row.appendChild(el('div', 'nm', ENDING_LABELS[k].t));
    row.appendChild(el('div', 'ct', String(n)));
    row.appendChild(el('div', 'pc', pct.toFixed(1) + '%'));
    const bb = el('div', 'bb'); const i = el('i'); i.style.width = `${Math.min(100, pct * 2.6)}%`;
    bb.appendChild(i); row.appendChild(bb);
    c.appendChild(row);
  }
  const pro = ['WORLD_CLASS', 'TOP_FLIGHT', 'PRO'].reduce((s, k) => s + (res.counts[k] || 0), 0);
  const paid = pro + (res.counts.SECOND_DIV || 0) + (res.counts.SEMI_PRO || 0);
  const s = sec('요약');
  s.appendChild(kv('1부 이상 프로', ((pro / res.n) * 100).toFixed(1) + '%', 'good'));
  s.appendChild(kv('축구로 급여를 받은 인생', ((paid / res.n) * 100).toFixed(1) + '%'));
  s.appendChild(kv('축구를 그만둔 인생', (((res.counts.QUIT || 0) / res.n) * 100).toFixed(1) + '%', 'warn'));
  c.appendChild(s);

  const sm = sec('샘플 — 같은 재능이 다른 인생이 되는가');
  for (const x of res.samples) {
    const d = el('div', 'muted');
    d.style.marginBottom = '7px';
    d.textContent = `PA ${x.pot} → 전성기 ${x.peak} (쓰지 못한 재능 ${x.pot - x.peak}) · ${x.apps}경기 ${x.goals}골 · A매치 ${x.caps} · ${ENDING_LABELS[x.ending].t}\n${x.path || '클럽 이력 없음'}`;
    d.style.whiteSpace = 'pre-wrap';
    sm.appendChild(d);
  }
  c.appendChild(sm);
  return c;
}

/* ─────────────── 라우터 ─────────────── */

function render() {
  if (UI.game && UI.game.over) { renderEnding(); return; }
  if (UI.screen === 'game') { renderGame(); return; }
  if (UI.screen === 'batch') { renderBatch(); return; }
  renderStart();
}

document.addEventListener('keydown', (e) => {
  if (UI.screen !== 'game' || !UI.game || !UI.game.pending) return;
  const i = parseInt(e.key, 10);
  if (i >= 1 && i <= UI.game.pending.choices.length) { choose(UI.game, i - 1); render(); }
});

render();

</script>
